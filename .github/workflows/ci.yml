name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ruff lint
            os: ubuntu-latest
            python-version: "3.10"
            command: ruff check .
          - name: Ruff format
            os: ubuntu-latest
            python-version: "3.10"
            command: ruff format --check .
          - name: Tests (Ubuntu, Python 3.10)
            os: ubuntu-latest
            python-version: "3.10"
            command: pytest
          - name: Tests (Ubuntu, Python 3.14)
            os: ubuntu-latest
            python-version: "3.14"
            command: pytest
          - name: Tests (Windows, Python 3.10)
            os: windows-latest
            python-version: "3.10"
            command: pytest
          - name: Tests (Windows, Python 3.14)
            os: windows-latest
            python-version: "3.14"
            command: pytest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

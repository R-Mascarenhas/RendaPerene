name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Chromium, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install E2E dependencies
        run: python -m pip install -e ".[dev,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser journey
        run: pytest e2e --browser chromium --tracing retain-on-failure --screenshot only-on-failure
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: test-results/
          retention-days: 7

  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ruff lint
            os: ubuntu-latest
            python-version: "3.10"
            command: ruff check .
          - name: Ruff format
            os: ubuntu-latest
            python-version: "3.10"
            command: ruff format --check .
          - name: Tests (Ubuntu, Python 3.10)
            os: ubuntu-latest
            python-version: "3.10"
            command: pytest
          - name: Tests (Ubuntu, Python 3.14)
            os: ubuntu-latest
            python-version: "3.14"
            command: pytest
          - name: Tests (Windows, Python 3.10)
            os: windows-latest
            python-version: "3.10"
            command: pytest
          - name: Tests (Windows, Python 3.14)
            os: windows-latest
            python-version: "3.14"
            command: pytest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

name: Package native distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-validation:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version.txt must contain a semantic X.Y.Z version" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use the vX.Y.Z format" >&2
              exit 1
            fi
            if [[ "${REF_NAME#v}" != "$version" ]]; then
              echo "Release tag does not match version.txt" >&2
              exit 1
            fi
          fi

  quality-gate:
    name: CI quality gate
    uses: ./.github/workflows/ci.yml

  package-windows:
    name: Windows x64 package
    needs: [release-validation, quality-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and smoke-test Windows bundle
        shell: cmd
        run: build_windows_exe.bat
      - name: Create Windows checksum
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -Filter "RendaPerene-v*-windows-x64.zip" | Select-Object -First 1
          if ($null -eq $archive) { throw "Windows archive was not created" }
          $hash = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -NoNewline "$($archive.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: RendaPerene-windows-x64
          path: |
            dist/RendaPerene-v*-windows-x64.zip
            dist/RendaPerene-v*-windows-x64.zip.sha256
          if-no-files-found: error

  package-ubuntu:
    name: Ubuntu x64 package
    needs: [release-validation, quality-gate]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and smoke-test Ubuntu bundle
        run: bash scripts/build_linux.sh
      - name: Create Ubuntu checksum
        run: |
          archive="$(find dist -maxdepth 1 -name 'RendaPerene-v*-ubuntu-x64.tar.gz' -print -quit)"
          test -n "$archive"
          archive_name="$(basename "$archive")"
          (cd "$(dirname "$archive")" && sha256sum "$archive_name" > "$archive_name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: RendaPerene-ubuntu-x64
          path: |
            dist/RendaPerene-v*-ubuntu-x64.tar.gz
            dist/RendaPerene-v*-ubuntu-x64.tar.gz.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package-windows, package-ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RendaPerene-*-x64
          path: release-assets
          merge-multiple: true
      - name: Verify release assets and checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          windows_archive="release-assets/RendaPerene-v${version}-windows-x64.zip"
          ubuntu_archive="release-assets/RendaPerene-v${version}-ubuntu-x64.tar.gz"
          test -f "$windows_archive"
          test -f "$ubuntu_archive"
          (cd release-assets && sha256sum -c "RendaPerene-v${version}-windows-x64.zip.sha256")
          (cd release-assets && sha256sum -c "RendaPerene-v${version}-ubuntu-x64.tar.gz.sha256")
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "RendaPerene ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            release-assets/RendaPerene-*.zip \
            release-assets/RendaPerene-*.tar.gz \
            release-assets/*.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
